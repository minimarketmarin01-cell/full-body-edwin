<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171A1C">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Full Body Edwin">
<title>Full Body — Edwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F2; --card:#FFFFFF; --ink:#1E2022; --muted:#6B7075; --line:#E6E6E1;
  --accent:#D9622B; --accent2:#3B6EA5; --accent-ink:#FFFFFF; --ok:#3F7D4F; --ok-bg:#E7F2E9;
  --chip-bg:#EFEFEA;
  /* Panel de músculos: siempre oscuro, estilo app de entrenamiento, sin depender del tema claro/oscuro. */
  --muscle-bg:#15171A; --muscle-base:#3C4046; --muscle-primary:#E8783C; --muscle-secondary:#6FA8E0;
  font-size:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15171A; --card:#1E2124; --ink:#F2F2ED; --muted:#9A9FA5; --line:#2B2F33;
    --accent:#E8783C; --accent2:#6FA8E0; --accent-ink:#171A1C; --ok:#5FB073; --ok-bg:#1E2E22;
    --chip-bg:#2A2E32;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  padding-bottom:76px;
}
h1,h2,h3{font-family:Manrope,sans-serif; margin:0;}
header.top{
  position:sticky; top:0; z-index:10; background:var(--bg);
  padding:14px 16px 10px; border-bottom:1px solid var(--line);
}
header.top h1{font-size:19px; font-weight:800;}
header.top .sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
.tabs{display:flex; gap:6px; margin-top:12px;}
.tab{
  flex:1; text-align:center; padding:9px 4px; border-radius:10px;
  font-family:Manrope; font-weight:700; font-size:14px; color:var(--muted);
  background:var(--chip-bg); border:1px solid transparent; cursor:pointer;
}
.tab.active{background:var(--accent); color:var(--accent-ink);}
main{padding:14px 16px 24px;}
.view{display:none;}
.view.active{display:block;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; margin-bottom:12px;
}
.ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.ex-name{font-family:Manrope; font-weight:700; font-size:15.5px;}
.ex-badge-wrap{display:flex; flex-direction:column; align-items:center; gap:3px; flex-shrink:0;}
.ex-badge{
  font-size:11px; font-weight:600; color:var(--muted); background:var(--chip-bg);
  padding:3px 8px; border-radius:999px; white-space:nowrap;
}
.ex-badge-wrap .muscle-icon{width:22px; height:33px;}
.ex-target{font-size:12.5px; color:var(--muted); margin-top:3px;}
.ex-notes{font-size:12px; color:var(--muted); margin-top:6px; font-style:italic;}
.ex-links{display:flex; align-items:center; gap:14px; margin-top:9px; flex-wrap:wrap;}
.video-link{
  display:inline-flex; align-items:center; gap:5px; background:none; border:none; padding:0;
  font-family:Inter; font-size:12.5px; font-weight:600; color:var(--accent); text-decoration:none; cursor:pointer;
}
.video-link svg{width:14px; height:14px;}
.muscle-toggle{
  display:inline-flex; align-items:center; gap:5px; background:none; border:none;
  font-family:Inter; font-size:12.5px; font-weight:600; color:var(--muted); padding:0; cursor:pointer;
}
.muscle-toggle svg{width:13px; height:13px; transition:transform .15s;}
.muscle-toggle.open svg{transform:rotate(180deg);}
.muscle-panel{
  margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
}
.muscle-diagram{
  display:flex; flex-direction:column; gap:12px; width:100%;
  background:var(--muscle-bg); border-radius:14px; padding:16px 10px 14px;
}
.muscle-diagram-bodies{display:flex; justify-content:center; gap:16px;}
.muscle-diagram-bodies > div{text-align:center; min-width:0;}
.anatomy-body{width:min(150px, 40vw); max-width:100%; height:auto; display:block;}
.muscle-region{stroke:var(--muscle-bg); stroke-width:7; stroke-linejoin:round;}
.muscle-region.neutral{fill:var(--muscle-base);}
.muscle-region.primary{fill:var(--muscle-primary);}
.muscle-region.secondary{fill:var(--muscle-secondary);}
.view-label{font-size:11px; color:#9AA0A6; margin-top:5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;}
.muscle-legend{
  list-style:none; margin:0; padding:0;
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px 18px;
}
.muscle-legend li{font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; color:#F2F2ED;}
.muscle-legend li::before{content:""; width:9px; height:9px; border-radius:3px; display:inline-block;}
.muscle-legend li.primary::before{background:var(--muscle-primary);}
.muscle-legend li.secondary{color:#B9BEC4; font-weight:500;}
.muscle-legend li.secondary::before{background:var(--muscle-secondary);}
.sets{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.set-row{display:grid; grid-template-columns:28px 1fr 1fr 52px; gap:8px; align-items:center;}
.set-row .n{font-size:13px; color:var(--muted); font-weight:600;}
.field-unit{position:relative;}
.set-row input{
  width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:9px; padding:9px 30px 9px 8px; font-size:15px; text-align:center;
  font-family:Inter;
}
.set-row input::placeholder{color:var(--muted); opacity:.7;}
.unit-label{
  position:absolute; right:9px; top:50%; transform:translateY(-50%);
  font-size:10.5px; font-weight:700; color:var(--muted); pointer-events:none;
  text-transform:uppercase; letter-spacing:.02em;
}
.set-btn{
  border:none; border-radius:9px; background:var(--chip-bg); color:var(--muted);
  font-weight:700; font-size:13px; padding:9px 0; cursor:pointer;
}
.set-btn.done{background:var(--ok-bg); color:var(--ok);}
.section-title{font-family:Manrope; font-weight:800; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px;}
select, .field-input{
  width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:10px; padding:11px; font-size:15px; font-family:Inter;
}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{padding:7px 6px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle;}
th{color:var(--muted); font-weight:600; font-size:12px;}
.muscle-icon{width:20px; height:30px; display:block;}
.muscle-body{fill:var(--chip-bg); stroke:var(--line); stroke-width:1;}
.muscle-highlight{fill:var(--accent);}
.bar-wrap{display:flex; align-items:center; gap:8px; margin:6px 0;}
.bar-label{width:56px; font-size:11.5px; color:var(--muted); flex-shrink:0;}
.bar-track{flex:1; background:var(--chip-bg); border-radius:6px; height:16px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:6px;}
.bar-val{width:38px; text-align:right; font-size:12px; color:var(--muted); flex-shrink:0;}
.empty{color:var(--muted); font-size:13.5px; text-align:center; padding:20px 0;}
.toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px;
  font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s;
  z-index:50;
}
.toast.show{opacity:1;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-overlay[hidden]{display:none;}
.modal-panel{
  background:var(--card); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  position:relative; -webkit-overflow-scrolling:touch;
}
@media (min-width:640px){
  .modal-overlay{align-items:center; padding:20px;}
  .modal-panel{max-width:560px; border-radius:20px; max-height:90vh;}
}
.modal-close{
  position:absolute; top:14px; right:14px; background:var(--chip-bg); border:none; border-radius:50%;
  width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer;
}
.modal-close svg{width:16px; height:16px;}
.technique-anim{margin:4px 0 14px;}
.technique-anim iframe{
  display:block; width:100%; aspect-ratio:16/9; height:auto; border:none;
  border-radius:14px; background:var(--muscle-bg);
}
.technique-yt-link{
  display:inline-block; margin-top:8px; font-size:12.5px; font-weight:600;
  color:var(--muted); text-decoration:none;
}
.technique-title{font-family:Manrope; font-size:17px; font-weight:800; margin-bottom:12px; padding-right:28px;}
.technique-block{margin-bottom:14px;}
.technique-label{font-family:Manrope; font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ok); margin-bottom:6px;}
.technique-label.errores{color:#B5482F;}
.technique-list{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px;}
.technique-list li{font-size:13.5px; color:var(--ink); line-height:1.4;}
nav.bottom{
  position:fixed; bottom:0; left:0; right:0; background:var(--card);
  border-top:1px solid var(--line); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:10;
}
nav.bottom button{
  flex:1; background:none; border:none; color:var(--muted); font-family:Inter;
  font-size:11px; padding:6px 0; display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer;
}
nav.bottom button.active{color:var(--accent); font-weight:700;}
nav.bottom svg{width:20px; height:20px;}
.btn-primary{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
  padding:12px; font-family:Manrope; font-weight:700; font-size:14.5px; width:100%; cursor:pointer;
}
.btn-secondary{
  background:var(--chip-bg); color:var(--ink); border:none; border-radius:10px;
  padding:11px; font-family:Inter; font-weight:600; font-size:13.5px; width:100%; cursor:pointer; margin-top:8px;
}
.settings-row{margin-bottom:14px;}
.settings-row label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
.status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
.status-line{font-size:13px; color:var(--muted); margin-top:10px;}
</style>
</head>
<body>

<header class="top">
  <h1>Full Body — Edwin</h1>
  <div class="sub">Hipertrofia · 3 días/semana · <span id="todayLabel"></span></div>
  <div class="tabs" id="sessionTabs">
    <div class="tab" data-s="A">Sesión A</div>
    <div class="tab" data-s="B">Sesión B</div>
    <div class="tab" data-s="C">Sesión C</div>
  </div>
</header>

<main>
  <section class="view active" id="view-hoy">
    <div id="exList"></div>
  </section>

  <section class="view" id="view-historial">
    <div class="settings-row">
      <label>Ejercicio</label>
      <select id="historyExercise"></select>
    </div>
    <div id="historyBody"></div>
  </section>

  <section class="view" id="view-volumen">
    <p class="status-line" style="margin-top:0;">Series semanales objetivo por grupo muscular, según el programa. No depende de la API.</p>
    <table>
      <thead><tr><th></th><th>Grupo</th><th>A</th><th>B</th><th>C</th><th>Total</th><th>Rango evidencia</th></tr></thead>
      <tbody id="volumenBody"></tbody>
    </table>
  </section>

  <section class="view" id="view-ajustes">
    <div class="settings-row">
      <label>URL de la API (Cloudflare Worker)</label>
      <input class="field-input" id="apiUrlInput" placeholder="https://fullbody-edwin-api.tuusuario.workers.dev">
    </div>
    <button class="btn-primary" id="saveApiUrl">Guardar</button>
    <button class="btn-secondary" id="testApiUrl">Probar conexión</button>
    <div class="status-line" id="apiStatus"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="techniqueModal" hidden>
  <div class="modal-panel">
    <button class="modal-close" id="techniqueClose" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="technique-anim" id="techniqueAnim"></div>
    <h3 class="technique-title" id="techniqueTitle"></h3>
    <div class="technique-block">
      <div class="technique-label">Cómo hacerlo</div>
      <ul class="technique-list" id="techniqueSteps"></ul>
    </div>
    <div class="technique-block">
      <div class="technique-label errores">Errores comunes</div>
      <ul class="technique-list errores" id="techniqueMistakes"></ul>
    </div>
    <button class="btn-primary" id="techniqueCloseBtn" type="button">Cerrar</button>
  </div>
</div>

<nav class="bottom" id="bottomNav">
  <button data-view="hoy" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v18M18 3v18M6 8h12M6 16h12"/></svg>
    Hoy
  </button>
  <button data-view="historial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>
    Historial
  </button>
  <button data-view="volumen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="4" height="10"/><rect x="10" y="5" width="4" height="15"/><rect x="16" y="13" width="4" height="7"/></svg>
    Volumen
  </button>
  <button data-view="ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Ajustes
  </button>
</nav>

<script>
const PROGRAM = {
  A: [
    {ex:"Sentadilla (back squat)", grupo:"Cuádriceps", series:3, reps:"8-10", rir:"2", notas:"Técnica primero; profundidad completa cómoda", sec:["Glúteo","Isquiotibiales","Core"]},
    {ex:"Press banca (barra o mancuerna)", grupo:"Pecho", series:3, reps:"8-10", rir:"2", sec:["Tríceps","Hombro"]},
    {ex:"Remo con barra", grupo:"Espalda", series:3, reps:"10-12", rir:"2", sec:["Bíceps"]},
    {ex:"Press militar mancuerna", grupo:"Hombro", series:3, reps:"10-12", rir:"2", sec:["Tríceps","Core"]},
    {ex:"Curl femoral tumbado", grupo:"Isquiotibiales", series:3, reps:"12-15", rir:"1.5", sec:["Glúteo"]},
    {ex:"Curl bíceps con barra o mancuerna", grupo:"Bíceps", series:2, reps:"12-15", rir:"1", sec:[]},
  ],
  B: [
    {ex:"Peso muerto rumano", grupo:"Isquiotibiales", series:3, reps:"8-10", rir:"2", notas:"Rango sin perder la curva lumbar neutra", sec:["Glúteo","Espalda"]},
    {ex:"Press inclinado mancuerna", grupo:"Pecho", series:3, reps:"10-12", rir:"2", sec:["Hombro","Tríceps"]},
    {ex:"Jalón al pecho", grupo:"Espalda", series:3, reps:"10-12", rir:"2", sec:["Bíceps"]},
    {ex:"Elevaciones laterales", grupo:"Hombro", series:3, reps:"15-20", rir:"1", sec:[]},
    {ex:"Extensión de cuádriceps", grupo:"Cuádriceps", series:3, reps:"12-15", rir:"1.5", sec:[]},
    {ex:"Tríceps en polea", grupo:"Tríceps", series:3, reps:"12-15", rir:"1", sec:[]},
  ],
  C: [
    {ex:"Prensa de piernas", grupo:"Cuádriceps", series:3, reps:"10-12", rir:"2", sec:["Glúteo"]},
    {ex:"Remo unilateral mancuerna", grupo:"Espalda", series:3, reps:"10-12", rir:"2", sec:["Bíceps"]},
    {ex:"Press militar barra", grupo:"Hombro", series:3, reps:"8-10", rir:"2", sec:["Tríceps"]},
    {ex:"Hip thrust", grupo:"Glúteo", series:3, reps:"10-12", rir:"2", sec:["Isquiotibiales"]},
    {ex:"Face pull", grupo:"Hombro", series:3, reps:"15", rir:"1", notas:"Deltoide posterior / salud de hombro", view:"back", sec:["Espalda"]},
    {ex:"Plancha / core", grupo:"Core", series:3, reps:"30-45s", rir:"—", notas:"Series por tiempo", sec:[]},
  ],
};

const GROUP_VIEW = {
  "Pecho":"front", "Bíceps":"front", "Cuádriceps":"front", "Core":"front", "Hombro":"front",
  "Espalda":"back", "Tríceps":"back", "Glúteo":"back", "Isquiotibiales":"back",
};

const VOLUMEN = [
  {grupo:"Cuádriceps", a:3, b:3, c:3, total:9, rango:"10-16 series/sem"},
  {grupo:"Isquiotibiales", a:3, b:3, c:0, total:6, rango:"8-14 series/sem"},
  {grupo:"Glúteo", a:0, b:0, c:3, total:3, rango:"8-14 series/sem"},
  {grupo:"Pecho", a:3, b:3, c:0, total:6, rango:"10-16 series/sem"},
  {grupo:"Espalda", a:3, b:3, c:3, total:9, rango:"10-18 series/sem"},
  {grupo:"Hombro", a:3, b:3, c:6, total:12, rango:"10-18 series/sem"},
  {grupo:"Bíceps", a:2, b:0, c:0, total:2, rango:"6-12 series/sem"},
  {grupo:"Tríceps", a:0, b:3, c:0, total:3, rango:"6-12 series/sem"},
  {grupo:"Core", a:0, b:0, c:3, total:3, rango:"4-8 series directas"},
];

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

const DEFAULT_API_URL = "https://fullbody-edwin-api.minimarketmarin01.workers.dev";
let apiUrl = localStorage.getItem("fbe_api_url") || DEFAULT_API_URL;
let currentSession = localStorage.getItem("fbe_session") || "A";
const todayISO = () => new Date().toISOString().slice(0,10);

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

async function api(path, opts){
  if(!apiUrl){ toast("Configura la URL de la API en Ajustes"); throw new Error("no api url"); }
  const res = await fetch(apiUrl.replace(/\/$/,"") + path, {
    headers:{"Content-Type":"application/json"}, ...opts
  });
  if(!res.ok) throw new Error("API error " + res.status);
  return res.json();
}

function renderTabs(){
  $$(".tab", $("#sessionTabs")).forEach(tab=>{
    tab.classList.toggle("active", tab.dataset.s === currentSession);
  });
}

let exRenderToken = 0;

async function renderExercises(){
  const token = ++exRenderToken;
  const list = $("#exList");
  const day = PROGRAM[currentSession];

  const [logsResult, ...lastResults] = await Promise.allSettled([
    api(`/api/logs?date=${todayISO()}`),
    ...day.map(item => api(`/api/last?exercise=${encodeURIComponent(item.ex)}`)),
  ]);
  if(token !== exRenderToken) return;

  let todaysLogs = {};
  if(logsResult.status === "fulfilled"){
    logsResult.value.forEach(l => { todaysLogs[l.exercise + "_" + l.set_number] = l; });
  }

  const cardsHtml = day.map((item, idx) => {
    let lastHint = {};
    const lastRes = lastResults[idx];
    if(lastRes.status === "fulfilled"){
      lastRes.value.forEach(r => { lastHint[r.set_number] = r; });
    }

    let setsHtml = "";
    for(let n=1; n<=item.series; n++){
      const saved = todaysLogs[item.ex + "_" + n];
      const hint = lastHint[n];
      const wPlaceholder = hint?.weight ?? "";
      const rPlaceholder = hint?.reps ?? "";
      setsHtml += `
        <div class="set-row" data-ex="${encodeURIComponent(item.ex)}" data-n="${n}">
          <div class="n">${n}</div>
          <div class="field-unit">
            <input type="number" inputmode="decimal" class="w-input" placeholder="${wPlaceholder}" value="${saved?.weight ?? ""}">
            <span class="unit-label">kg</span>
          </div>
          <div class="field-unit">
            <input type="number" inputmode="numeric" class="r-input" placeholder="${rPlaceholder}" value="${saved?.reps ?? ""}">
            <span class="unit-label">reps</span>
          </div>
          <button class="set-btn ${saved ? "done" : ""}">${saved ? "✓" : "Ok"}</button>
        </div>`;
    }

    const videoUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(item.ex + " técnica correcta");

    return `
      <div class="ex-head">
        <div>
          <div class="ex-name">${item.ex}</div>
          <div class="ex-target">${item.series} series · ${item.reps} reps · RIR ${item.rir}</div>
        </div>
        <div class="ex-badge-wrap">
          ${muscleIcon(item.grupo)}
          <div class="ex-badge">${item.grupo}</div>
        </div>
      </div>
      ${item.notas ? `<div class="ex-notes">${item.notas}</div>` : ""}
      <div class="ex-links">
        <button class="video-link" type="button" data-ex="${encodeURIComponent(item.ex)}" data-video="${videoUrl}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Ver técnica
        </button>
        <button class="muscle-toggle" type="button">
          Músculos trabajados
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div class="muscle-panel" hidden>${muscleDiagram(item)}</div>
      <div class="sets">${setsHtml}</div>
    `;
  });

  list.innerHTML = "";
  cardsHtml.forEach(html => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = html;
    list.appendChild(card);
  });

  $$(".muscle-toggle", list).forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const panel = btn.closest(".card").querySelector(".muscle-panel");
      panel.hidden = !panel.hidden;
      btn.classList.toggle("open", !panel.hidden);
    });
  });

  $$(".video-link", list).forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const ex = decodeURIComponent(btn.dataset.ex);
      const data = TECHNIQUE_VIDEOS[ex];
      if(data){
        openTechniqueModal(ex, data);
      } else {
        window.open(btn.dataset.video, "_blank", "noopener");
      }
    });
  });

  $$(".set-btn", list).forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const row = btn.closest(".set-row");
      const ex = decodeURIComponent(row.dataset.ex);
      const n = Number(row.dataset.n);
      const weight = parseFloat($(".w-input", row).value) || null;
      const reps = parseInt($(".r-input", row).value) || null;
      if(weight === null && reps === null){ toast("Ingresa peso o reps"); return; }
      try{
        await api("/api/logs", {method:"POST", body: JSON.stringify({
          date: todayISO(), session: currentSession, exercise: ex, set_number: n, weight, reps, rir: null
        })});
        btn.classList.add("done");
        btn.textContent = "✓";
        toast("Serie guardada");
      }catch(e){
        toast("No se pudo guardar. Revisa Ajustes.");
      }
    });
  });
}

const SLUG_TO_GRUPO = {
  "chest":"Pecho", "abs":"Core", "biceps":"Bíceps", "triceps":"Tríceps", "front-deltoids":"Hombro",
  "quadriceps":"Cuádriceps", "trapezius":"Espalda", "back-deltoids":"Hombro", "upper-back":"Espalda",
  "lower-back":"Espalda", "gluteal":"Glúteo", "hamstring":"Isquiotibiales",
};

function anatomicalBody(view, highlightMap){
  const muscles = view === "front" ? ANTERIOR_MUSCLES : POSTERIOR_MUSCLES;
  const polys = muscles.map(m => {
    const grupo = SLUG_TO_GRUPO[m.slug];
    const tone = (grupo && highlightMap[grupo]) || "neutral";
    return m.points.map(pts =>
      `<polygon class="muscle-region ${tone}" data-muscle="${m.slug}" points="${pts}"/>`
    ).join("");
  }).join("");
  return `
    <svg viewBox="0 0 1000 2000" class="anatomy-body" role="img" aria-label="Vista ${view === "front" ? "frontal" : "posterior"}">
      ${polys}
    </svg>`;
}

function muscleDiagram(item){
  const groups = [
    {name:item.grupo, tone:"primary", view: item.view || GROUP_VIEW[item.grupo]},
    ...(item.sec || []).map(name => ({name, tone:"secondary", view: GROUP_VIEW[name]})),
  ];
  const names = [item.grupo, ...(item.sec || [])];
  const frontMap = {};
  const backMap = {};
  groups.forEach(g => { (g.view === "front" ? frontMap : backMap)[g.name] = g.tone; });

  return `
    <div class="muscle-diagram">
      <div class="muscle-diagram-bodies">
        <div>${anatomicalBody("front", frontMap)}<div class="view-label">Frente</div></div>
        <div>${anatomicalBody("back", backMap)}<div class="view-label">Espalda</div></div>
      </div>
      <ul class="muscle-legend">
        ${names.map((n,i) => `<li class="${i === 0 ? "primary" : "secondary"}">${n}</li>`).join("")}
      </ul>
    </div>
  `;
}

function openTechniqueModal(name, data){

  $("#techniqueAnim").innerHTML = `

      title="Técnica: ${name}"
      loading="lazy"

      allowfullscreen
    ></iframe>
    <a class="technique-yt-link" href="https://www.youtube.com/watch?v=${data.videoId}" target="_blank" rel="noopener">Ver en YouTube ↗</a>
  `;
  $("#techniqueSteps").innerHTML = data.pasos.map(p => `<li>${p}</li>`).join("");
  $("#techniqueMistakes").innerHTML = data.errores.map(e => `<li>${e}</li>`).join("");
  $("#techniqueModal").hidden = false;
  document.body.style.overflow = "hidden";
}

function closeTechniqueModal(){
  $("#techniqueModal").hidden = true;
  document.body.style.overflow = "";
  $("#techniqueAnim").innerHTML = "";
}

function renderVolumen(){
  const tbody = $("#volumenBody");
  tbody.innerHTML = VOLUMEN.map(v => `
    <tr>
      <td>${muscleIcon(v.grupo)}</td>
      <td>${v.grupo}</td><td>${v.a}</td><td>${v.b}</td><td>${v.c}</td>
      <td><strong>${v.total}</strong></td><td>${v.rango}</td>
    </tr>
  `).join("") + `
    <tr>
      <td></td>
      <td><strong>Total semanal</strong></td>
      <td colspan="3"></td>
      <td><strong>${VOLUMEN.reduce((s,v)=>s+v.total,0)}</strong></td>
      <td></td>
    </tr>
  `;
}

function fillHistorySelect(){
  const sel = $("#historyExercise");
  const all = [...PROGRAM.A, ...PROGRAM.B, ...PROGRAM.C];
  sel.innerHTML = all.map(i => `<option value="${i.ex}">${i.ex}</option>`).join("");
}

async function renderHistory(){
  const ex = $("#historyExercise").value;
  const body = $("#historyBody");
  body.innerHTML = `<p class="empty">Cargando…</p>`;
  try{
    const logs = await api(`/api/logs?exercise=${encodeURIComponent(ex)}`);
    if(!logs.length){ body.innerHTML = `<p class="empty">Sin registros aún para este ejercicio.</p>`; return; }
    const maxWeight = Math.max(...logs.map(l => l.weight || 0), 1);
    const byDate = {};
    logs.forEach(l => { (byDate[l.date] = byDate[l.date] || []).push(l); });
    const dates = Object.keys(byDate).sort().reverse();
    let html = `<div class="section-title">Progresión de carga</div>`;
    dates.slice(0,10).reverse().forEach(d => {
      const top = Math.max(...byDate[d].map(l => l.weight || 0));
      html += `
        <div class="bar-wrap">
          <div class="bar-label">${d.slice(5)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(top/maxWeight*100).toFixed(0)}%"></div></div>
          <div class="bar-val">${top || "-"}kg</div>
        </div>`;
    });
    html += `<div class="section-title">Registros</div><table><thead><tr><th>Fecha</th><th>Set</th><th>Peso (kg)</th><th>Reps</th></tr></thead><tbody>`;
    logs.forEach(l => {
      html += `<tr><td>${l.date}</td><td>${l.set_number}</td><td>${l.weight ?? "-"}</td><td>${l.reps ?? "-"}</td></tr>`;
    });
    html += `</tbody></table>`;
    body.innerHTML = html;
  }catch(e){
    body.innerHTML = `<p class="empty">Configura la URL de la API en Ajustes.</p>`;
  }
}

function switchView(name){
  $$(".view").forEach(v => v.classList.remove("active"));
  $(`#view-${name}`).classList.add("active");
  $$("nav.bottom button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
  if(name === "historial") renderHistory();
}

$("#sessionTabs").addEventListener("click", e=>{
  const tab = e.target.closest(".tab");
  if(!tab) return;
  currentSession = tab.dataset.s;
  localStorage.setItem("fbe_session", currentSession);
  renderTabs();
  renderExercises();
});

$("#bottomNav").addEventListener("click", e=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  switchView(btn.dataset.view);
});

$("#historyExercise").addEventListener("change", renderHistory);

$("#techniqueClose").addEventListener("click", closeTechniqueModal);
$("#techniqueCloseBtn").addEventListener("click", closeTechniqueModal);
$("#techniqueModal").addEventListener("click", e=>{
  if(e.target.id === "techniqueModal") closeTechniqueModal();
});
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && !$("#techniqueModal").hidden) closeTechniqueModal();
});

$("#saveApiUrl").addEventListener("click", ()=>{
  apiUrl = $("#apiUrlInput").value.trim();
  localStorage.setItem("fbe_api_url", apiUrl);
  toast("URL guardada");
  renderExercises();
});

$("#testApiUrl").addEventListener("click", async ()=>{
  const status = $("#apiStatus");
  status.textContent = "Probando…";
  try{
    const url = ($("#apiUrlInput").value.trim()).replace(/\/$/,"");
    const res = await fetch(url + "/api/health");
    const data = await res.json();
    status.innerHTML = data.ok ? `<span class="status-dot" style="background:var(--ok)"></span>Conectado` : "Sin respuesta válida";
  }catch(e){
    status.innerHTML = `<span class="status-dot" style="background:#c0392b"></span>No se pudo conectar`;
  }
});

$("#todayLabel").textContent = new Date().toLocaleDateString("es-CL", {weekday:"long", day:"numeric", month:"long"});
$("#apiUrlInput").value = apiUrl;
renderTabs();
fillHistorySelect();
renderVolumen();
renderExercises();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
